<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>논문연구및특허</title>
<style>
  :root{
    --bg:#F5FAF8;
    --card:#FFFFFF;
    --ink:#16231F;
    --muted:#66766F;
    --brand:#0E9E74;
    --brand-dark:#087A5A;
    --brand-light:#E7F8F1;
    --amber:#F5A623;
    --amber-light:#FFF4E0;
    --danger:#E5484D;
    --danger-light:#FDEDEE;
    --border:#E3EAE7;
    --shadow:0 8px 28px rgba(16,35,28,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic','Pretendard',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding:20px 14px 60px;
  }
  .wrap{max-width:560px;margin:0 auto;}

  /* ---------- header ---------- */
  .eyebrow{
    font-size:12.5px;font-weight:700;color:var(--brand-dark);
    letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;
  }
  h1.page-title{
    font-size:clamp(22px,5.5vw,28px);
    font-weight:800;letter-spacing:-.01em;margin:0 0 4px;line-height:1.25;
  }
  .page-sub{color:var(--muted);font-size:13.5px;margin:0 0 22px;}
  .topic-line{
    font-size:15px;font-weight:700;color:var(--brand-dark);margin:0 0 6px;
  }
  .topic-line:empty{display:none;}

  /* ---------- scoreboard ---------- */
  .scorebar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(245,250,248,.92);backdrop-filter:blur(6px);
    padding:10px 2px 14px;margin:-8px -2px 10px;
  }
  .score-badge{
    display:flex;align-items:center;gap:8px;
    background:var(--card);border:1px solid var(--border);
    border-radius:999px;padding:7px 14px 7px 10px;box-shadow:var(--shadow);
  }
  .score-dot{
    width:22px;height:22px;border-radius:50%;
    background:linear-gradient(145deg,var(--amber),#E08E00);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;flex:none;
  }
  .score-num{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;}
  .score-label{font-size:11.5px;color:var(--muted);font-weight:600;}
  .score-pop{
    position:absolute;top:-6px;right:8px;color:var(--brand-dark);
    font-weight:800;font-size:13px;opacity:0;pointer-events:none;
  }
  .score-pop.show{animation:popup .8s ease forwards;}
  @keyframes popup{
    0%{opacity:0;transform:translateY(4px);}
    25%{opacity:1;transform:translateY(-6px);}
    100%{opacity:0;transform:translateY(-22px);}
  }

  /* ---------- progress (test-tube style pill) ---------- */
  .progress-wrap{margin-bottom:18px;}
  .progress-meta{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px;
  }
  .progress-meta b{color:var(--ink);font-weight:800;}
  .progress-track{
    height:12px;border-radius:999px;background:#E4EEEA;
    border:1px solid var(--border);overflow:hidden;
  }
  .progress-fill{
    height:100%;border-radius:999px;
    background:linear-gradient(90deg,#22B98A,var(--brand-dark));
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- cards ---------- */
  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:18px;padding:20px 18px;box-shadow:var(--shadow);
    margin-bottom:14px;
  }

  /* ---------- home screen ---------- */
  .quiz-pick{
    display:block;width:100%;text-align:left;cursor:pointer;
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:18px 18px;margin-bottom:12px;box-shadow:var(--shadow);
    transition:transform .15s ease,border-color .15s ease;
  }
  .quiz-pick:active{transform:scale(.98);}
  .quiz-pick:hover{border-color:var(--brand);}
  .quiz-pick .tag{
    display:inline-block;font-size:11px;font-weight:800;color:var(--brand-dark);
    background:var(--brand-light);border-radius:999px;padding:3px 10px;margin-bottom:8px;
  }
  .quiz-pick .qtitle{font-size:16.5px;font-weight:800;margin:0 0 4px;}
  .quiz-pick .qmeta{font-size:12.5px;color:var(--muted);}
  .quiz-pick .arrow{float:right;color:var(--brand);font-weight:800;font-size:18px;}

  /* ---------- question ---------- */
  .qnum{font-size:12.5px;font-weight:800;color:var(--brand-dark);margin-bottom:8px;}
  .qtext{font-size:17px;font-weight:700;line-height:1.5;margin:0 0 18px;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;align-items:flex-start;gap:10px;text-align:left;
    width:100%;padding:13px 14px;border-radius:13px;
    border:1.5px solid var(--border);background:#FCFDFD;
    font-size:14.5px;line-height:1.45;font-weight:600;color:var(--ink);
    cursor:pointer;transition:.15s ease;
  }
  .opt .oletter{
    flex:none;width:22px;height:22px;border-radius:50%;
    border:1.5px solid #C9D5D0;color:var(--muted);
    font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;
    margin-top:1px;
  }
  .opt:hover:not(.locked){border-color:var(--brand);background:#FAFFFD;}
  .opt.correct{
    background:var(--brand-light);border-color:var(--brand);color:var(--brand-dark);
  }
  .opt.correct .oletter{background:var(--brand);border-color:var(--brand);color:#fff;}
  .opt.wrong{
    background:var(--danger-light);border-color:var(--danger);color:#B5222A;
  }
  .opt.wrong .oletter{background:var(--danger);border-color:var(--danger);color:#fff;}
  .opt.dim{opacity:.5;}
  .opt.locked{cursor:default;}

  .feedback{
    margin-top:14px;padding:13px 14px;border-radius:13px;font-size:13.5px;
    line-height:1.55;font-weight:600;display:none;
  }
  .feedback.show{display:block;animation:fadein .25s ease;}
  .feedback.ok{background:var(--brand-light);color:var(--brand-dark);}
  .feedback.no{background:var(--danger-light);color:#B5222A;}
  .feedback .fb-head{font-weight:800;margin-bottom:2px;}
  @keyframes fadein{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

  .next-row{margin-top:16px;display:none;}
  .next-row.show{display:block;}

  /* ---------- buttons ---------- */
  .btn{
    display:block;width:100%;text-align:center;padding:14px 16px;
    border-radius:13px;border:none;font-size:15px;font-weight:800;
    cursor:pointer;transition:.15s ease;font-family:inherit;
  }
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-primary:active{transform:scale(.98);}
  .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--border);}
  .btn-ghost:hover{border-color:var(--brand);color:var(--brand-dark);}
  .btn-danger-ghost{background:#fff;color:#B5222A;border:1.5px solid #F3C6C8;}
  .btn-row{display:flex;gap:10px;margin-top:10px;}
  .btn-row .btn{flex:1;}

  /* ---------- result screen ---------- */
  .result-hero{text-align:center;padding:8px 4px 4px;}
  .result-ring{
    width:118px;height:118px;border-radius:50%;margin:6px auto 16px;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    background:conic-gradient(var(--brand) calc(var(--pct)*1%),#E4EEEA 0);
  }
  .result-ring-inner{
    width:92px;height:92px;border-radius:50%;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .result-ring-inner b{font-size:24px;font-weight:800;}
  .result-ring-inner span{font-size:11px;color:var(--muted);font-weight:700;}
  .result-title{font-size:19px;font-weight:800;margin:0 0 4px;}
  .result-sub{font-size:13.5px;color:var(--muted);margin:0 0 20px;}
  .result-stats{display:flex;gap:10px;margin-bottom:18px;}
  .stat-box{
    flex:1;background:#FCFDFD;border:1px solid var(--border);border-radius:13px;
    padding:12px 8px;text-align:center;
  }
  .stat-box b{display:block;font-size:19px;font-weight:800;}
  .stat-box span{font-size:11.5px;color:var(--muted);font-weight:700;}

  .review-list{margin-top:6px;}
  .review-item{
    border:1px solid var(--border);border-radius:13px;padding:12px 14px;margin-bottom:8px;
    font-size:13px;line-height:1.5;
  }
  .review-item .ri-q{font-weight:700;margin-bottom:4px;}
  .review-item .ri-a{color:var(--muted);}
  .review-item .ri-a b{color:var(--brand-dark);}

  .footer-note{
    text-align:center;color:var(--muted);font-size:11.5px;margin-top:26px;line-height:1.6;
  }

  .hidden{display:none !important;}

  @media (max-width:380px){
    .qtext{font-size:16px;}
    .opt{font-size:13.5px;padding:11px 12px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">1주차 5차시 · 형성평가 퀴즈</div>
  <h1 class="page-title">논문연구및특허</h1>
  <p class="topic-line" id="topic-line">건강기능식품 개발전략과 원료개발과정</p>
  <p class="page-sub" id="page-sub">문항을 클릭하면 바로 정답과 해설이 표시됩니다. 아래에서 퀴즈를 시작하세요.</p>

  <!-- ========== HOME ========== -->
  <div id="screen-home">
    <div class="quiz-pick" data-qindex="0">
      
      <div class="qtitle">건강기능식품 개발전략과 원료개발과정 <span class="arrow">→</span></div>
      <div class="qmeta">10문항 · 약 5~10분 소요</div>
    </div>
    
  </div>

  <!-- ========== QUIZ ========== -->
  <div id="screen-quiz" class="hidden">
    <div class="scorebar">
      <div style="font-size:13px;font-weight:800;color:var(--muted);" id="quiz-name">-</div>
      <div class="score-badge" style="position:relative;">
        <div class="score-dot">★</div>
        <div>
          <div class="score-num"><span id="score-num">0</span><span class="score-label"> 점</span></div>
        </div>
        <div class="score-pop" id="score-pop">+10</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span>문항 <b id="prog-current">1</b> / <b id="prog-total">10</b></span>
        <span id="prog-mode"></span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    </div>

    <div class="card">
      <div class="qnum" id="qnum-label">문항 1</div>
      <p class="qtext" id="qtext">-</p>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="next-row" id="next-row">
        <button class="btn btn-primary" id="btn-next">다음 문항</button>
      </div>
    </div>
  </div>

  <!-- ========== RESULT ========== -->
  <div id="screen-result" class="hidden">
    <div class="card result-hero">
      <div class="result-ring" id="result-ring" style="--pct:0;">
        <div class="result-ring-inner">
          <b id="result-pct">0%</b>
          <span>정답률</span>
        </div>
      </div>
      <div class="result-title" id="result-title">수고하셨습니다!</div>
      <p class="result-sub" id="result-sub"></p>
      <div class="result-stats">
        <div class="stat-box"><b id="stat-correct">0</b><span>맞은 문항</span></div>
        <div class="stat-box"><b id="stat-wrong">0</b><span>틀린 문항</span></div>
        <div class="stat-box"><b id="stat-points">0</b><span>획득 점수</span></div>
      </div>
      <div id="retry-row" class="btn-row hidden">
        <button class="btn btn-danger-ghost" id="btn-retry-wrong">틀린 문항만 다시 풀기</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="btn-home">처음으로</button>
      </div>
    </div>

    <div id="review-wrap"></div>
  </div>

  <p class="footer-note">형성평가 퀴즈 · 정답 클릭 시 즉시 채점됩니다 · 결과는 저장되지 않습니다</p>
</div>

<script>
const QUIZZES = [{"id": "w5ch", "title": "건강기능식품 개발전략과 원료개발과정", "chasi": "1주차 5차시", "questions": [{"q": "건강기능식품 개발전략 7단계 중 가장 먼저 이루어지는 것은?", "options": ["안전성 확보", "개발 목표 설정", "기능성 효능 증명", "제품 형태 결정"], "correct": 1, "explain": "7단계 개발전략의 1단계는 '개발 목표 설정'입니다."}, {"q": "In House 방법은 소재 선별부터 제품화까지 한 회사(기관)가 어떻게 진행하는 개발 방법인가?", "options": ["주도적으로", "외주에 의존해", "정부 지원으로만", "무작위로"], "correct": 0, "explain": "In House 방법은 한 회사(기관)가 소재 선별부터 제품화까지 주도적으로 진행합니다."}, {"q": "In House 방법과 부분투자 방법의 비교로 옳지 않은 것은?", "options": ["In House는 자기만의 고유 소재 확보가 가능하다", "부분투자는 원하는 소재를 빠르게 개발할 수 있다", "In House는 로열티·기술이전 비용이 필수로 발생한다", "부분투자는 파트너와의 신뢰 관계가 중요하다"], "correct": 2, "explain": "로열티·기술이전 비용은 부분투자 방법의 특징이며, In House 방법의 단점은 시간·비용이 크게 든다는 것입니다."}, {"q": "천연물 원료개발의 전체 흐름은 연구방향설정 → 대상소재선정 → 무엇 → 표준화 → 기준규격설정 순인가?", "options": ["활성물질 추적", "효능평가", "기능성입증", "품목제조신고"], "correct": 0, "explain": "원료개발 5단계는 연구방향설정→대상소재선정→활성물질추적→표준화→기준규격설정입니다."}, {"q": "독성시험 등 안전성 평가의 신뢰성을 보증하기 위해 인력·시설·시험방법 전 과정을 체계적으로 관리하는 규정은?", "options": ["GMP", "GLP", "HACCP", "ISO"], "correct": 1, "explain": "GLP(비임상시험관리기준)는 안전성 평가의 신뢰성을 보증하기 위한 관리 규정입니다. GMP(제조관리기준)와 혼동에 주의하세요."}, {"q": "활성물질 추적 과정에서 화학구조 규명에 사용하는 분석법으로 옳지 않은 것은?", "options": ["NMR", "MS", "UV/IR", "GLP"], "correct": 3, "explain": "구조 분석에는 NMR·MS·UV/IR이 사용됩니다. GLP는 안전성 평가 규정으로 구조분석법이 아닙니다."}, {"q": "지표성분은 농도-기능 상관관계가 낮아도 무방한 대신, 구조가 안정적이고 무엇이 쉬워야 하는가?", "options": ["측정", "분리", "합성", "보관"], "correct": 0, "explain": "지표성분은 구조가 안정적이고 측정이 쉬워야 합니다."}, {"q": "분리된 단일물질이 추출물과 비슷한 수준의 효능을 보이는 경우(Case A)에 대한 설명으로 옳은 것은?", "options": ["기능성분과 지표성분을 반드시 다르게 설정해야 한다", "기능성분과 지표성분을 동일하게 설정할 수 있다", "추출물 자체를 지표성분으로 설정해야 한다", "이 경우는 실제로 발생하지 않는다"], "correct": 1, "explain": "Case A는 단일물질이 효능도 내고 측정도 안정적이므로 기능성분=지표성분으로 함께 설정합니다."}, {"q": "기능성분·지표성분 설정 과정은 '설정 → 원물 표준화 → 제조공정 표준화 → 무엇' 순으로 진행되는가?", "options": ["기준규격 설정", "품질관리(QC)", "임상시험", "특허출원"], "correct": 0, "explain": "설정 과정 4단계의 마지막은 '기준규격 설정'입니다."}, {"q": "다음 중 '기능성분'을 비유적으로 표현한 말로 옳은 것은?", "options": ["신분증", "주연배우", "관객", "무대 장치"], "correct": 1, "explain": "기능성분은 '주연배우'(효능 담당), 지표성분은 '신분증'(품질 확인용)으로 비유됩니다."}]}];
const TOTAL_POINTS_PER_Q = 10;

let state = {
  quizIndex: 0,
  order: [],          // 현재 진행 중인 문항 인덱스 배열 (원본 questions 기준)
  pos: 0,              // order 내 진행 위치
  points: 0,
  answers: {},          // {questionIndex: chosenOptionIndex}
  isRetry: false,
};

const $ = (id) => document.getElementById(id);

function showScreen(name){
  $('screen-home').classList.toggle('hidden', name !== 'home');
  $('screen-quiz').classList.toggle('hidden', name !== 'quiz');
  $('screen-result').classList.toggle('hidden', name !== 'result');
  $('page-sub').classList.toggle('hidden', name !== 'home');
  window.scrollTo({top:0, behavior:'smooth'});
}

function startQuiz(qIndex, order, isRetry){
  state.quizIndex = qIndex;
  state.order = order;
  state.pos = 0;
  state.points = isRetry ? state.points : 0;
  state.answers = {};
  state.isRetry = !!isRetry;
  $('quiz-name').textContent = QUIZZES[qIndex].title + (isRetry ? ' · 오답 다시풀기' : '');
  $('prog-mode').textContent = isRetry ? '오답 재도전' : '';
  $('score-num').textContent = state.points;
  $('prog-total').textContent = order.length;
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion(){
  const quiz = QUIZZES[state.quizIndex];
  const qi = state.order[state.pos];
  const q = quiz.questions[qi];

  $('prog-current').textContent = state.pos + 1;
  $('prog-fill').style.width = Math.round((state.pos / state.order.length) * 100) + '%';
  $('qnum-label').textContent = '문항 ' + (state.pos + 1);
  $('qtext').textContent = q.q;

  const optWrap = $('options');
  optWrap.innerHTML = '';
  optWrap.dataset.locked = '0';
  const letters = ['①','②','③','④'];
  q.options.forEach((optText, idx) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="oletter">' + letters[idx] + '</span><span>' + optText + '</span>';
    b.addEventListener('click', () => selectAnswer(idx, q, b));
    optWrap.appendChild(b);
  });

  $('feedback').className = 'feedback';
  $('feedback').innerHTML = '';
  $('next-row').classList.remove('show');
}

function selectAnswer(idx, q, btnEl){
  if (btnEl.parentElement.dataset.locked === '1') return;
  btnEl.parentElement.dataset.locked = '1';

  const qi = state.order[state.pos];
  state.answers[qi] = idx;

  const opts = Array.from(btnEl.parentElement.children);
  opts.forEach((el, i) => {
    el.classList.add('locked');
    if (i === q.correct) el.classList.add('correct');
    else if (i === idx) el.classList.add('wrong');
    else el.classList.add('dim');
  });

  const fb = $('feedback');
  const isCorrect = (idx === q.correct);
  if (isCorrect){
    state.points += TOTAL_POINTS_PER_Q;
    $('score-num').textContent = state.points;
    const pop = $('score-pop');
    pop.classList.remove('show'); void pop.offsetWidth; pop.classList.add('show');
    fb.className = 'feedback ok show';
    fb.innerHTML = '<div class="fb-head">✔ 정답입니다! (+10점)</div>' + q.explain;
  } else {
    fb.className = 'feedback no show';
    fb.innerHTML = '<div class="fb-head">✕ 오답입니다</div>' + q.explain;
  }

  $('next-row').classList.add('show');
  $('btn-next').textContent = (state.pos === state.order.length - 1) ? '결과 보기' : '다음 문항';
}

$('btn-next').addEventListener('click', () => {
  if (state.pos < state.order.length - 1){
    state.pos += 1;
    renderQuestion();
  } else {
    finishQuiz();
  }
});

function finishQuiz(){
  const quiz = QUIZZES[state.quizIndex];
  let correctCount = 0;
  const wrongIdx = [];
  state.order.forEach((qi) => {
    if (state.answers[qi] === quiz.questions[qi].correct) correctCount++;
    else wrongIdx.push(qi);
  });
  const total = state.order.length;
  const pct = Math.round((correctCount / total) * 100);

  $('result-ring').style.setProperty('--pct', pct);
  $('result-pct').textContent = pct + '%';
  $('stat-correct').textContent = correctCount;
  $('stat-wrong').textContent = wrongIdx.length;
  $('stat-points').textContent = state.points;

  let title, sub;
  if (pct === 100){ title = '완벽해요! 🎉'; sub = quiz.title + ' 전 문항 정답!'; }
  else if (pct >= 70){ title = '잘하셨어요!'; sub = quiz.title + ' 핵심 개념을 잘 이해하고 있어요.'; }
  else if (pct >= 40){ title = '조금만 더!'; sub = '틀린 문항 위주로 슬라이드를 다시 확인해보세요.'; }
  else { title = '다시 도전해봐요'; sub = '강의자료를 복습한 뒤 다시 풀어보세요.'; }
  $('result-title').textContent = title;
  $('result-sub').textContent = sub;

  const retryRow = $('retry-row');
  if (wrongIdx.length > 0){
    retryRow.classList.remove('hidden');
    $('btn-retry-wrong').onclick = () => startQuiz(state.quizIndex, wrongIdx, true);
  } else {
    retryRow.classList.add('hidden');
  }

  const reviewWrap = $('review-wrap');
  if (wrongIdx.length > 0){
    let html = '<div class="card"><div style="font-weight:800;font-size:14px;margin-bottom:10px;">📋 틀린 문항 다시보기</div><div class="review-list">';
    wrongIdx.forEach((qi) => {
      const q = quiz.questions[qi];
      const chosen = state.answers[qi];
      html += '<div class="review-item"><div class="ri-q">' + q.q + '</div>' +
              '<div class="ri-a">내 답: ' + q.options[chosen] + ' &nbsp;→&nbsp; 정답: <b>' + q.options[q.correct] + '</b></div></div>';
    });
    html += '</div></div>';
    reviewWrap.innerHTML = html;
  } else {
    reviewWrap.innerHTML = '';
  }

  showScreen('result');
}

$('btn-home').addEventListener('click', () => showScreen('home'));

document.querySelectorAll('.quiz-pick').forEach((el) => {
  el.addEventListener('click', () => {
    const qIndex = parseInt(el.dataset.qindex, 10);
    const order = QUIZZES[qIndex].questions.map((_, i) => i);
    startQuiz(qIndex, order, false);
  });
});
</script>
</body>
</html>
